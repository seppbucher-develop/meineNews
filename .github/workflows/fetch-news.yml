name: Fetch News

on:
  schedule:
    # Alle 4 Stunden (UTC). Intervall hier anpassen, z.B. "0 * * * *" für stündlich.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch news & generate summaries
        run: node scripts/fetch-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & push data/news.json if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an data/news.json."
          else
            git commit -m "News aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
